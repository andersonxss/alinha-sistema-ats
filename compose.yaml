name: sistema-ats
x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-ats}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ats}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure BETTER_AUTH_SECRET em .env}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  STORAGE_PATH: /data/resumes
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}
      POSTGRES_DB: ${POSTGRES_DB:-ats}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: ["npm", "run", "api"]
    environment: *backend-environment
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - resume_files:/data/resumes
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: build
    environment: *backend-environment
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  worker:
    build: .
    environment: *backend-environment
    command: ["npm", "run", "worker"]
    volumes:
      - resume_files:/data/resumes
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/ats-worker-health','utf8'))<300000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
volumes:
  postgres_data:
  resume_files:
